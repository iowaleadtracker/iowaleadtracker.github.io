# Builds https://iowaleadtracker.github.io/ from the iowaleadtracker source repository.
#
# The canonical site is https://iowaleadtracker.com/ (Cloudflare). This mirror serves the
# same build for readers who can't reach that domain, for example on networks that block
# Cloudflare. Both are built from the source repository's `main`
# with the saved forecasts, replayed as of when they were pulled, so they show the same maps.
#
# Like the source's deploy, it reuses the site the source's CI already built from the same
# files (artifact `site-<key>`, key from the source's tools/site_key.py), after checking
# that the CI run passed and that its own commit has the same key. That takes a minute or
# two instead of about 20. Without such a build, or if the download fails, it builds the
# site itself.
name: Build mirror

on:
  workflow_dispatch: # run by hand, or by `make_map_picker.py --deploy`
  schedule:
    # Every 15 minutes, off the :00/:15/:30/:45 marks when GitHub is busiest: it runs
    # schedules on a best-effort basis, and "*/15" went unrun for over 3 hours on Nov. 21.
    # Builds only when the source's main branch has changed.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_REPO: iowaleadtracker/iowaleadtracker
  MIRROR_URL: https://iowaleadtracker.github.io/

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Has the source changed since the last mirror?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          head=$(gh api "repos/$SOURCE_REPO/commits/main" --jq .sha)
          live=$(curl -fsS "${MIRROR_URL}build.txt" 2>/dev/null | tr -d '[:space:]' || true)
          echo "source main: $head; mirror built from: ${live:-nothing yet}"
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$head" != "$live" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the source
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.check.outputs.sha }}
          path: source

      - name: Set up Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: source/.python-version

      - name: Find the source CI's build of these files
        id: ci
        if: steps.check.outputs.changed == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/site_key.py ]; then
            echo "The source has no tools/site_key.py; building here."
            exit 0
          fi
          key=$(python tools/site_key.py)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          gh api "repos/$SOURCE_REPO/actions/artifacts?name=site-$key&per_page=20" \
            --jq '.artifacts[] | select(.expired | not) | "\(.workflow_run.id) \(.workflow_run.head_sha)"' \
            > "$RUNNER_TEMP/candidates" || : > "$RUNNER_TEMP/candidates"
          while read -r run sha <&3; do
            info=$(gh api "repos/$SOURCE_REPO/actions/runs/$run" \
              --jq '"\(.path) \(.status) \(.conclusion) \(.head_repository.full_name)"') || continue
            if [ "$info" != ".github/workflows/ci.yml completed success $SOURCE_REPO" ]; then
              echo "skip CI run $run: $info"
              continue
            fi
            # The artifact's name is only a hint: check the run's own commit.
            if ! git fetch -q --depth=1 origin "$sha"; then
              echo "skip CI run $run: can't fetch $sha"
              continue
            fi
            if [ "$(python tools/site_key.py "$sha")" != "$key" ]; then
              echo "skip CI run $run: its commit $sha has different files"
              continue
            fi
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "Reusing the site built and tested by $SOURCE_REPO CI run $GITHUB_SERVER_URL/$SOURCE_REPO/actions/runs/$run ($sha)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          done 3< "$RUNNER_TEMP/candidates"
          echo "No finished, passing CI build of these files; building here." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the source CI's build
        id: download
        if: steps.ci.outputs.run
        continue-on-error: true # then build instead
        uses: actions/download-artifact@v8
        with:
          name: site-${{ steps.ci.outputs.key }}
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-site

      - name: Build the site and the mirror
        if: steps.check.outputs.changed == 'true'
        working-directory: source
        env:
          REUSE: ${{ steps.download.outcome == 'success' }}
        run: |
          # The scenario folder is found, not named, so renaming it needs no change here.
          builders=(scenarios/*/make_map_picker.py)
          if [ "${#builders[@]}" -ne 1 ] || [ ! -f "${builders[0]}" ]; then
            echo "::error::expected one scenarios/*/make_map_picker.py, found: ${builders[*]}"
            exit 1
          fi
          python -m pip install -r requirements.txt
          cd "$(dirname "${builders[0]}")"
          if [ "$REUSE" = "true" ]; then
            # CI's maps; this only re-renders the pages and writes the mirror.
            mkdir -p outputs/site
            cp -R "$RUNNER_TEMP/ci-site/." outputs/site/
            python make_map_picker.py --mirror "$RUNNER_TEMP/mirror"
          else
            if [ -n "${{ steps.ci.outputs.run }}" ]; then
              echo "::warning::Couldn't download the source CI's build; building here."
            fi
            python make_map_picker.py --build --mirror "$RUNNER_TEMP/mirror"
          fi
          echo "${{ steps.check.outputs.sha }}" > "$RUNNER_TEMP/mirror/build.txt"

      - name: Refuse a build that downloaded weather
        if: steps.check.outputs.changed == 'true'
        # The saved forecasts must reproduce the main site; any download would have been
        # written into the cache file and would make the mirror differ.
        run: git -C source diff --exit-code -- 'scenarios/*/met_cache/'

      - name: Upload the mirror
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/mirror

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
